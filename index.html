<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国34省围栏数据可视化</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { height: 80vh; width: 100%; border: 1px solid #ccc; }
        .filter-container { margin-bottom: 10px; }
        .filter-btn {
            margin: 5px;
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: #f5f5f5;
            cursor: pointer;
            border-radius: 4px;
        }
        .filter-btn.active {
            background: #0078A8;
            color: white;
        }
        .legend {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .area-label {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            background-color: rgba(255, 255, 255, 0.7);
            border: none;
            box-shadow: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>中国34省围栏数据可视化</h1>
    <div class="filter-container">
        <strong>筛选省份:</strong>
        <button class="filter-btn active" data-province="all">全国</button>
        <div id="province-buttons" style="display: inline;"></div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script>
        const map = L.map('map').setView([35, 105], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let provinces = [];
        let provinceLayers = {};
        let currentProvince = 'all';

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function loadProvinces() {
            fetch('./china_gis.json')
                .then(response => response.json())
                .then(data => {
                    provinces = data.map(p => {
                        const geojson = JSON.parse(p.st_asgeojson);
                        const randomColor = getRandomColor();
                        const originalStyle = {
                            fillColor: randomColor,
                            weight: 1,
                            opacity: 1,
                            color: 'white',
                            fillOpacity: 0.7
                        };

                        const layer = L.geoJSON(geojson, { style: originalStyle }).addTo(map);

                        const turfPolygon = turf.multiPolygon(geojson.coordinates);
                        const area = turf.area(turfPolygon);
                        const centroid = turf.centroid(turfPolygon).geometry.coordinates.reverse();

                        layer.bindTooltip(`${p.fence_name}<br>面积: ${(area / 1000000).toFixed(2)} km²`, {
                            permanent: true,
                            direction: 'center',
                            className: 'area-label'
                        });
                        
                        const provinceData = {
                            ...p,
                            layer: layer,
                            area: area,
                            centroid: centroid,
                            originalStyle: originalStyle
                        };

                        provinceLayers[p.fence_name] = provinceData;

                        return provinceData;
                    });

                    createProvinceButtons();
                });
        }

        function createProvinceButtons() {
            const container = document.getElementById('province-buttons');
            provinces.forEach(province => {
                const button = document.createElement('button');
                button.className = 'filter-btn';
                        button.textContent = province.fence_name;
                        button.dataset.province = province.fence_name;
                        button.id = `province-${province.fence_name}`;
                button.addEventListener('click', () => selectProvince(province.fence_name));
                container.appendChild(button);
            });
        }

        function selectProvince(provinceName) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            
            const backgroundStyle = {
                fillColor: '#d3d3d3',
                weight: 1,
                color: '#fff',
                fillOpacity: 0.5
            };

            if (provinceName === 'all') {
                document.querySelector('[data-province="all"]').classList.add('active');
                map.setView([35, 105], 4);
                for (const name in provinceLayers) {
                    provinceLayers[name].layer.setStyle(provinceLayers[name].originalStyle);
                }
            } else {
                document.querySelector(`[data-province="${provinceName}"]`).classList.add('active');
                
                for (const name in provinceLayers) {
                    provinceLayers[name].layer.setStyle(backgroundStyle);
                }

                const selected = provinceLayers[provinceName];
                if (selected) {
                    const highlightStyle = { ...selected.originalStyle, weight: 3, color: 'black' };
                    selected.layer.setStyle(highlightStyle);
                    map.setView(selected.centroid, 6);
                }
            }
            currentProvince = provinceName;
        }

        document.querySelector('[data-province="all"]').addEventListener('click', () => selectProvince('all'));

        loadProvinces();
    </script>
</body>
</html>
