<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>China Map</title>
    <style>
        #container {
            width: 100%;
            height: 100vh;
        }
        #selector {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <select id="selector"></select>

    <script src="https://webapi.amap.com/maps?v=2.0&key=您的高德地图key"></script>
    <script src="https://cdn.jsdelivr.net/npm/path-data-polyfill@1.0.4/path-data-polyfill.min.js"></script>
    <script>
        // 初始化地图
        const map = new AMap.Map('container', {
            zoom: 4,
            center: [104.06, 35.67],
            viewMode: '3D'
        });

        // 加载围栏数据
        fetch('./china_gis.json')
            .then(response => response.json())
            .then(data => {
                const selector = document.getElementById('selector');
                const allOption = document.createElement('option');
                allOption.value = 'all';
                allOption.textContent = '全国';
                selector.appendChild(allOption);

                data.forEach(province => {
                    const option = document.createElement('option');
                    option.value = province.fence_name;
                    option.textContent = province.fence_name;
                    selector.appendChild(option);

                    const geojson = JSON.parse(province.st_asgeojson);
                    const polygons = new AMap.GeoJSON({
                        geoJSON: geojson,
                        getPolygon: (geojson, lnglats) => {
                            const area = AMap.GeometryUtil.ringArea(lnglats[0]);
                            const polygon = new AMap.Polygon({
                                path: lnglats,
                                fillColor: getRandomColor(),
                                strokeOpacity: 1,
                                strokeColor: 'white',
                                strokeWeight: 0.9,
                                zIndex: 100
                            });

                            const label = new AMap.Text({
                                text: `${province.fence_name}\n${(area / 1000000).toFixed(2)} km²`,
                                position: polygon.getBounds().getCenter(),
                                style: {
                                    'background-color': 'transparent',
                                    'border': 'none',
                                    'color': 'black',
                                    'font-size': '12px',
                                    'text-align': 'center'
                                }
                            });
                            map.add(label);
                            
                            return polygon;
                        }
                    });
                    map.add(polygons);
                });

                selector.addEventListener('change', (event) => {
                    const selectedProvince = event.target.value;
                    if (selectedProvince === 'all') {
                        map.setZoomAndCenter(4, [104.06, 35.67]);
                    } else {
                        const provinceData = data.find(p => p.fence_name === selectedProvince);
                        const geojson = JSON.parse(provinceData.st_asgeojson);
                        const bounds = new AMap.Bounds();
                        const coordinates = geojson.coordinates;
                        coordinates.forEach(polygon => {
                            polygon.forEach(ring => {
                                ring.forEach(point => {
                                    bounds.extend(new AMap.LngLat(point[0], point[1]));
                                });
                            });
                        });
                        map.setBounds(bounds);
                    }
                });
            });

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }
    </script>
</body>
</html>
